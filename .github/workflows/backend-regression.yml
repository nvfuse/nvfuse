name: Backend compatibility regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: Sequential rounds of the four portable API/FUSE combinations
        required: true
        default: '3'

permissions:
  contents: read

concurrency:
  group: backend-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: API/FUSE x image/kernel (four combinations)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux FUSE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make pkg-config libfuse3-dev fuse3 python3
          sudo modprobe fuse
          sudo modprobe loop
          test -c /dev/fuse
      - name: Verify regression reporting
        run: python3 -m unittest discover -s tests -p 'test_backend_regression.py' -v
      - name: Run functional regression without benchmarks
        env:
          REGRESSION_REPEAT: ${{ inputs.repeat || '1' }}
        run: python3 tests/run_backend_regression.py --profile portable --sanitize --repeat "$REGRESSION_REPEAT" --report-dir build/test-results/backend-ci
      - name: Upload reports, including failed-run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-backend-regression
          if-no-files-found: warn
          path: |
            build/test-results/**/*.json
            build/test-results/**/*.log
            build/test-results/**/*.img
